apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: server-ingress
  namespace: server
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /server-api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: server-api
                port:
                  number: 10002
          - path: /server-msggateway(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: server-msggateway
                port:
                  number: 10001
