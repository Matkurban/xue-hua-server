# LiveKit SFU + Egress + Ingress — cluster-ready.
# Scale livekit with: docker compose -f docker-compose.cluster.yml up --scale livekit=2
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    depends_on:
      - redis
    environment:
      - LIVEKIT_REDIS_ADDRESS=redis:6379

  livekit-egress:
    image: livekit/egress:latest
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      - egress-data:/out
    depends_on:
      - livekit
      - redis

  livekit-ingress:
    image: livekit/ingress:latest
    environment:
      - INGRESS_CONFIG_FILE=/etc/ingress.yaml
    volumes:
      - ./ingress.yaml:/etc/ingress.yaml:ro
    ports:
      - "1935:1935"
      - "8085:8085"
    depends_on:
      - livekit
      - redis

volumes:
  egress-data:
