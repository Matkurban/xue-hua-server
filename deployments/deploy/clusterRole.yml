apiVersion: v1
kind: Namespace
metadata:
  name: server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: server
  namespace: server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: server-service-reader
  namespace: server
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: server-service-reader
  namespace: server
subjects:
  - kind: ServiceAccount
    name: server
    namespace: server
roleRef:
  kind: Role
  name: server-service-reader
  apiGroup: rbac.authorization.k8s.io
