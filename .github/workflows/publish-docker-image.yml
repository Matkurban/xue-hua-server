# Adapted from openimsdk/open-im-server v3.8.3-patch.18 publish-docker-image.yml
# for Matkurban/xue-hua-server. Builds the monorepo root Dockerfile and pushes
# multi-arch images to primary registries and ACR separately (ACR attestation quirk).
name: Publish Docker image to registries

on:
  push:
    branches:
      - release-*
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag version to be used for Docker image"
        required: true
        default: "latest"
  workflow_call:
    inputs:
      tag:
        description: "Tag version to be used for Docker image"
        required: true
        type: string
      checkout_sha:
        description: "Commit SHA to checkout"
        required: true
        type: string
      checkout_short_sha:
        description: "Short commit SHA for image tags"
        required: true
        type: string

env:
  IMAGE_NAME: "xue-hua-server"
  DOCKER_BUILDKIT: 1

jobs:
  publish-docker-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.merged == false) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.checkout_sha || inputs.tag || github.event.inputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.1.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.1.0
        with:
          driver-opts: network=host

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            registry.cn-hangzhou.aliyuncs.com/xuehua/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=sha,enable=${{ inputs.checkout_short_sha == '' }}
            type=raw,value=sha-${{ inputs.checkout_short_sha }},enable=${{ inputs.checkout_short_sha != '' }}
            type=raw,value=${{ inputs.tag || github.event.inputs.tag }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIREGISTRY_USERNAME }}
          password: ${{ secrets.ALIREGISTRY_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Push multi-architecture images
        if: success()
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            [[ "${tag%%/*}" != *.aliyuncs.com ]] || continue
            tag_args+=(--tag "$tag")
          done < <(printf '%s\n' "$IMAGE_TAGS" | tr ',' '\n')

          if [[ ${#tag_args[@]} -gt 0 ]]; then
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              "${tag_args[@]}" \
              --cache-from type=local,src=/tmp/docker-cache \
              --cache-to type=local,dest=/tmp/docker-cache-new,mode=max \
              --push .
          fi

      - name: Push multi-architecture images to ACR
        if: success()
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: '1'
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            [[ "${tag%%/*}" == *.aliyuncs.com ]] || continue
            tag_args+=(--tag "$tag")
          done < <(printf '%s\n' "$IMAGE_TAGS" | tr ',' '\n')

          if [[ ${#tag_args[@]} -gt 0 ]]; then
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              "${tag_args[@]}" \
              --cache-from type=local,src=/tmp/docker-cache \
              --push .
          fi

      - name: Move cache
        run: |
          rm -rf /tmp/docker-cache
          mv /tmp/docker-cache-new /tmp/docker-cache 2>/dev/null || true
